<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — Hassan Fakhry</title>

  <!-- ============================================================
       CHANGE THIS ONE LINE to point at the original page.
       It appears again in the <script> below — update both.
       ============================================================ -->
  <meta http-equiv="refresh" content="0; url=https://hassanfakhry.github.io/">

  <link rel="canonical" href="https://hassanfakhry.github.io/">
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#1e3a8a;--dark:#111;--gray:#555;--bg:#fafafa}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--dark);
         min-height:100vh;display:flex;align-items:center;justify-content:center;
         padding:2rem;text-align:center;line-height:1.6;-webkit-font-smoothing:antialiased}
    .card{max-width:32rem}
    p{color:var(--gray);font-size:1.05rem}
    a{color:var(--accent);font-weight:500}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
  </style>
</head>
<body>
  <div class="card">
    <p>This page has moved. Taking you to
      <a id="dest" href="https://hassanfakhry.github.io/">hassanfakhry.github.io</a> now —
      tap the link if nothing happens.</p>
  </div>

  <script>
    // Same destination as the <meta refresh> above.
    var TARGET = "https://hassanfakhry.github.io/";

    // Carry over any ?query or #hash the visitor arrived with.
    var url = TARGET + window.location.search + window.location.hash;
    document.getElementById("dest").href = url;

    // replace() keeps this stub out of the back-button history.
    window.location.replace(url);
  </script>
</body>
</html>
